# List every form used by this project in embeddables/forms/<id>/schema.yaml.
# After edits: pnpm build — import generated types from embeddables/_dist.
# Dinosaurus project. Deploys send this id, and it has to own the deploy key.
projectId: '78bf574f-57a9-4279-be2f-670c45efb42c'
forms:
  - id: '00000000-0000-4000-8000-000000000001'
    name: Contact
  # - id: "<second-form-uuid>"
  #   name: Second form
experiments:
protocols:
enabledModules:
  analytics: true
  experiments: false
  forms: true
  protocols: false
pages:
  - id: bienvenida
    title: Bienvenida
    path: /
    type: marketing
    app: app
  - id: energia
    title: Energía
    path: /quiz/energia
    type: form
    app: app
  - id: hogar
    title: Hogar
    path: /quiz/hogar
    type: form
    app: app
  - id: compania
    title: Compañía
    path: /quiz/compania
    type: form
    app: app
  - id: match
    title: Tu gatito
    path: /match
    type: pdp
    app: app
  - id: reserva
    title: Reserva
    path: /reserva
    type: checkout
    app: app
  - id: gracias
    title: Gracias
    path: /gracias
    type: landing
    app: app
# Embeddables Hosting builds and deploys these apps on every push. `pnpm build` writes both
# folders; see "Build output" in AGENTS.md.
hosting:
  apps:
    - slug: app
      server: dist/app
      client: dist/client
